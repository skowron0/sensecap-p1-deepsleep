name: Build SenseCAP P1 DeepSleep

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PlatformIO
        run: |
          python3 -m pip install platformio

      - name: Build firmware
        run: |
          pio run -e seeed_xiao_nrf52840

      - name: Download UF2 converter
        run: |
          git clone --depth 1 https://github.com/microsoft/uf2.git uf2

      - name: Convert ELF to HEX
        run: |
          ELF=$(find .pio/build -name firmware.elf -print -quit)

          if [ -z "$ELF" ]; then
            echo "ERROR: firmware.elf not found!"
            exit 1
          fi

          echo "Found ELF: $ELF"

          OBJCOPY=$(find ~/.platformio/packages \
            -path '*/bin/arm-none-eabi-objcopy' \
            -print -quit)

          if [ -z "$OBJCOPY" ]; then
            echo "ERROR: arm-none-eabi-objcopy not found!"
            exit 1
          fi

          "$OBJCOPY" -O ihex "$ELF" firmware.hex

      - name: Convert HEX to UF2
        run: |
          python3 uf2/utils/uf2conv.py \
            firmware.hex \
            -c -f 0xADA52840 \
            -o firmware.uf2

      - name: Upload UF2
        uses: actions/upload-artifact@v4
        with:
          name: SenseCAP-P1-DeepSleep-UF2
          path: firmware.uf2

