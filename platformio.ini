[platformio]
boards_dir = boards

[env:sensecap_p1_deepsleep]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed_sensecap_solar
framework = arduino

board_build.ldscript = nrf52840_s140_v7.ld

build_flags =
    -D ARDUINO_Seeed_XIAO_NRF52840
    -D NRF52840_XXAA
    -D SEEED_XIAO_NRF52840
    -D USE_LFXO

    -D LED_WHITE=11
    -D LED_BLUE=12
    -D VBAT_ENABLE=19
    -D BATTERY_PIN=16

    -D P_LORA_RESET=2
    -D P_LORA_BUSY=3
    -D P_LORA_NSS=4
    -D P_LORA_DIO_1=1
    -D SX126X_RXEN=5

    -D PIN_SPI_MISO=9
    -D PIN_SPI_MOSI=10
    -D PIN_SPI_SCK=8

    -D PIN_WIRE_SDA=14
    -D PIN_WIRE_SCL=15

    -D PIN_QSPI_SCK=21
    -D PIN_QSPI_CS=22
    -D PIN_QSPI_IO0=23
    -D PIN_QSPI_IO1=24
    -D PIN_QSPI_IO2=25
    -D PIN_QSPI_IO3=26

monitor_speed = 115200
