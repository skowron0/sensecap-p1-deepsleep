[env:seeed_xiao_nrf52840]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-afruitnrf52-nrf52840
framework = arduino

; UF2 bootloader upload (double-tap RESET to enter bootloader)
upload_protocol = uf2

; Keep the firmware minimal
build_flags =
    -Os
    -ffunction-sections
    -fdata-sections

