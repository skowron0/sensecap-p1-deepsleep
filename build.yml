name: Build SenseCAP P1 DeepSleep

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PlatformIO
        run: |
          python3 -m pip install platformio

      - name: Build firmware
        run: |
          pio run -e seeed_xiao_nrf52840

      - name: Download UF2 converter
        run: |
          git clone --depth 1 https://github.com/microsoft/uf2.git uf2

      - name: Convert HEX to UF2
        run: |
          python3 uf2/utils/uf2conv.py \
            .pio/build/seeed_xiao_nrf52840/firmware.hex \
            -c -f 0xADA52840 \
            -o firmware.uf2

      - name: Upload UF2
        uses: actions/upload-artifact@v4
        with:
          name: SenseCAP-P1-DeepSleep-UF2
          path: firmware.uf2
